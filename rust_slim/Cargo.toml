[package]
name = "rust_slim"
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A Slim Server for acceptance tests in rust"
repository = "https://github.com/killertux/temoc/tree/master/rust_slim"
keywords = ["acceptance", "testing", "slim", "temoc", "fitnesse"]
categories = ["development-tools::testing"]
readme = "readme.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
slim_protocol = { path = "../slim_protocol" }
convert_case = "0.6"
rust_slim_macros = { path = "../rust_slim_macros", optional = true }
thiserror = "1"
scraper = { version = "0.27", optional = true }

[dev-dependencies]
anyhow = "1"
trybuild = "1"

[features]
macros = ["dep:rust_slim_macros"]
# The SliM HTML-table hash conversion is optional in V0.5.  Keeping it
# feature-gated avoids adding HTML parsing work to fixtures that do not use
# FitNesse's hash widget.
html-hash = ["dep:scraper"]
conformance-tests = []

[[bin]]
name = "slim_conformance_server"
path = "tests/support/slim_conformance_server.rs"
test = false
bench = false
required-features = ["conformance-tests"]
