[package]
name = "temoc"
version = "0.10.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "An Acceptance test executor"
repository = "https://github.com/killertux/temoc/"
readme = "readme.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
convert_case = "0.6"
markdown = "1.0.0-alpha.15"
toml = "0.8"
ulid = "1"
slim_protocol = { version = "0.3.1", path = "../slim_protocol" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
libc = "0.2"
rand = "0.8"

[dev-dependencies]
rust_slim = { version = "0.3.1", path = "../rust_slim/", features = ["macros"] }
